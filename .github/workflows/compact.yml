name: Compact monthly parquet

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Month to compact as YYYY-MM (blank = previous month)"
        default: ""
      market:
        description: "Market to compact"
        type: choice
        options: [all, asx, uk, us, otc]
        default: all
  schedule:
    # 2nd of each month, 05:17 UTC — after the 1st's final ingests everywhere.
    - cron: "17 5 2 * *"

concurrency: compact

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compact
        run: |
          ARGS="--market ${{ inputs.market || 'all' }}"
          [ -n "${{ inputs.month }}" ] && ARGS="$ARGS --month ${{ inputs.month }}"
          python -m ingestion.compact $ARGS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          S3_LAKE_PREFIX: "market-data/"
