# BRANCH-ONLY OVERRIDE for the Claude-analyst build session. On main this is
# the production US ingest; here it harvests real Form 4 / SC 13G fixtures by
# running the SAME ingester code in --dry-run mode (local _lake/, S3 never
# touched) with US_FORMS widened, then commits the output to this branch.
# schedule: is intentionally absent — scheduled runs fire from main only.
name: Ingest US

on:
  workflow_dispatch:
    inputs:
      max_docs:
        description: "Cap documents this run"
        default: "150"
      dry_run:
        description: "(always dry-run on this branch)"
        type: boolean
        default: true
      lookback_days:
        description: "Walk this many days of EDGAR daily index before today"
        default: "3"
      max_filings:
        description: "Cap collection size"
        default: "1500"

concurrency: ingest-us

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Offline selftest
        run: python -m ingestion.selftest

      - name: Dry-run ingest with widened US form scope
        run: python -m ingestion.run --market us --dry-run --max-docs "${{ inputs.max_docs }}"
        env:
          S3_LAKE_PREFIX: "market-data/"
          US_FORMS: "4,4/A,SC 13G,SC 13G/A,SC 13D,SC 13D/A"
          MAX_US_FILINGS: "${{ inputs.max_filings || '1500' }}"
          US_LOOKBACK_DAYS: "${{ inputs.lookback_days || '3' }}"

      - name: Commit dry-run lake to this branch
        run: |
          set -euo pipefail
          mkdir -p _lake_export
          tar -czf "_lake_export/us-form4-dryrun.tar.gz" -C _lake .
          git config user.name "lake-export-bot"
          git config user.email "actions@users.noreply.github.com"
          git add _lake_export/us-form4-dryrun.tar.gz
          git commit -m "Dry-run Form 4/13G fixture harvest (US_FORMS widened, S3 untouched)"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
