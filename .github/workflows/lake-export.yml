# Build-time helper for the Claude-analyst build session (branch
# claude/claude-analyst-build-vl01y0): exports selected lake days as
# tarballs committed to this branch, because the build environment can reach
# github.com but neither S3 nor the Actions artifact store. Not for
# production use; remove with the branch.
name: Lake export (analyst build helper)

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "space-separated market:YYYY-MM-DD pairs, e.g. 'asx:2026-09-08 uk:2026-09-05'"
        required: true

permissions:
  contents: write

concurrency: lake-export-${{ github.run_id }}

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Export lake days
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          BUCKET: ${{ secrets.AWS_BUCKET_NAME }}
          SPEC: ${{ inputs.spec }}
        run: |
          set -euo pipefail
          mkdir -p _lake_export
          for pair in $SPEC; do
            market="${pair%%:*}"; day="${pair#*:}"
            y="${day:0:4}"; m="${day:5:2}"; d="${day:8:2}"
            dest="_export_stage/$market-$day"
            mkdir -p "$dest/documents/$market/$y/$m/$d" "$dest/manifests/$market"
            aws s3 cp --recursive --only-show-errors \
              "s3://$BUCKET/market-data/documents/$market/$y/$m/$d/" \
              "$dest/documents/$market/$y/$m/$d/" \
              --exclude '*' --include '*.json'
            aws s3 cp --only-show-errors \
              "s3://$BUCKET/market-data/manifests/$market/$day.jsonl" \
              "$dest/manifests/$market/$day.jsonl" || true
            aws s3 cp --only-show-errors \
              "s3://$BUCKET/market-data/manifests/$market/$day.done.json" \
              "$dest/manifests/$market/$day.done.json" || true
            count=$(find "$dest/documents" -name '*.json' | wc -l)
            echo "exported $market $day: $count documents"
            tar -C "$dest" -czf "_lake_export/$market-$day.tar.gz" .
          done
          ls -la _lake_export/

      - name: Commit tarballs to this branch
        run: |
          set -euo pipefail
          git config user.name "lake-export-bot"
          git config user.email "actions@users.noreply.github.com"
          git add _lake_export/
          git commit -m "Lake export for analyst build: ${{ inputs.spec }}"
          git push
