# BRANCH-ONLY OVERRIDE for the Claude-analyst build session. On main this
# file is the DuckDB query runner; on this branch it exports selected lake
# days as tarballs committed to the branch (the build environment can reach
# github.com but neither S3 nor the Actions artifact store). Dispatched via
# the registered "Query lake" workflow id with ref=this-branch. Remove with
# the branch.
name: Query lake

on:
  workflow_dispatch:
    inputs:
      sql:
        description: "IGNORED on this branch (kept for input compatibility)"
        required: false
        default: ""
      market:
        description: "IGNORED on this branch"
        default: ""
      month:
        description: "IGNORED on this branch"
        default: ""
      spec:
        description: "space-separated market:YYYY-MM-DD pairs, e.g. 'asx:2026-09-08 uk:2026-09-05'"
        required: false
        default: ""
      screener:
        description: "if 'true', also export global-screener analyses for the same docs"
        required: false
        default: ""

permissions:
  contents: write

concurrency: query-${{ github.run_id }}

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Export lake days
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          BUCKET: ${{ secrets.AWS_BUCKET_NAME }}
          SPEC: ${{ inputs.spec }}
        run: |
          set -euo pipefail
          if [ -z "$SPEC" ]; then echo "spec input is required on this branch"; exit 2; fi
          mkdir -p _lake_export
          for pair in $SPEC; do
            market="${pair%%:*}"; day="${pair#*:}"
            y="${day:0:4}"; m="${day:5:2}"; d="${day:8:2}"
            dest="_export_stage/$market-$day"
            mkdir -p "$dest/documents/$market/$y/$m/$d" "$dest/manifests/$market"
            aws s3 cp --recursive --only-show-errors \
              "s3://$BUCKET/market-data/documents/$market/$y/$m/$d/" \
              "$dest/documents/$market/$y/$m/$d/" \
              --exclude '*' --include '*.json'
            aws s3 cp --only-show-errors \
              "s3://$BUCKET/market-data/manifests/$market/$day.jsonl" \
              "$dest/manifests/$market/$day.jsonl" || true
            aws s3 cp --only-show-errors \
              "s3://$BUCKET/market-data/manifests/$market/$day.done.json" \
              "$dest/manifests/$market/$day.done.json" || true
            count=$(find "$dest/documents" -name '*.json' | wc -l)
            echo "exported $market $day: $count documents"
            tar -C "$dest" -czf "_lake_export/$market-$day.tar.gz" .
          done
          ls -la _lake_export/

      - name: Export global-screener analyses for the same docs
        if: inputs.screener == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          BUCKET: ${{ secrets.AWS_BUCKET_NAME }}
          SPEC: ${{ inputs.spec }}
        run: |
          set -euo pipefail
          pip -q install boto3
          python3 - <<'PYEOF'
          import os, tarfile, pathlib
          import boto3
          from botocore.exceptions import ClientError

          s3 = boto3.client("s3")
          bucket = os.environ["BUCKET"]
          for pair in os.environ["SPEC"].split():
              market, day = pair.split(":", 1)
              part = pathlib.Path(f"_export_stage/{market}-{day}/documents/{market}") \
                  / day[0:4] / day[5:7] / day[8:10]
              ids = [p.stem for p in part.glob("*.json")]
              out = pathlib.Path(f"_screener_stage/{market}-{day}")
              out.mkdir(parents=True, exist_ok=True)
              hits = 0
              for nid in ids:
                  key = f"global-screener/{market}/analysis/{nid}.json"
                  try:
                      body = s3.get_object(Bucket=bucket, Key=key)["Body"].read()
                  except ClientError as exc:
                      if exc.response["Error"]["Code"] in ("NoSuchKey", "404"):
                          continue
                      raise
                  (out / f"{nid}.json").write_bytes(body)
                  hits += 1
              print(f"screener {market} {day}: {hits} analyses of {len(ids)} docs")
              with tarfile.open(f"_lake_export/screener-{market}-{day}.tar.gz", "w:gz") as tf:
                  tf.add(out, arcname=".")
          PYEOF

      - name: Commit tarballs to this branch
        run: |
          set -euo pipefail
          git config user.name "lake-export-bot"
          git config user.email "actions@users.noreply.github.com"
          git add _lake_export/
          git commit -m "Lake export for analyst comparison: ${{ inputs.spec }}"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
