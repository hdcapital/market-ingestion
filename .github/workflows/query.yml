name: Query lake

on:
  workflow_dispatch:
    inputs:
      sql:
        description: "DuckDB SQL against the `docs` / `docs_compact` views"
        required: true
      market:
        description: "Restrict views to one market (asx|uk|us|otc; blank = all)"
        default: ""
      month:
        description: "Restrict views to one month (YYYY-MM; blank = all)"
        default: ""

concurrency: query-${{ github.run_id }}

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DuckDB
        run: pip install duckdb boto3

      - name: Run query
        run: python -m ingestion.query
        env:
          QUERY_SQL: ${{ inputs.sql }}
          QUERY_MARKET: ${{ inputs.market }}
          QUERY_MONTH: ${{ inputs.month }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          S3_LAKE_PREFIX: "market-data/"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: query-results-${{ github.run_id }}
          path: query_results.csv
          if-no-files-found: ignore

      # Artifact downloads live on Azure blob storage, which some restricted
      # clients (e.g. proxied Claude Code sessions) cannot reach. Publish the
      # CSV to a throwaway orphan branch too, so results are fetchable over
      # plain git. Prune query-results/* branches whenever.
      - name: Publish results to branch
        if: always()
        run: |
          [ -f query_results.csv ] || exit 0
          git config user.name "query-bot"
          git config user.email "actions@github.com"
          BR="query-results/${{ github.run_id }}"
          git checkout --orphan "$BR"
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f query_results.csv
          git commit -q -m "Query results for run ${{ github.run_id }}"
          git push -f origin "$BR"
